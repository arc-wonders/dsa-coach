{% extends "base.html" %}
{% block bare %}
<div style="min-height:100vh;display:grid;place-items:center;padding:16px">
  <div class="card" style="width:100%;max-width:420px;padding:28px;text-align:center">
    {% if ok %}<h1>Got it</h1><p class="sub"><b>{{ item.title }}</b>: {{ item.status }}.</p><p class="muted small">Your plan will adjust.</p>
    {% else %}<h1>Link not valid</h1>{% endif %}
    <a class="btn primary" href="/" style="margin-top:8px">Open DSA Coach</a>
  </div>
</div>
{% endblock %}
