{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:480px;margin:40px auto;text-align:center">
{% if ok %}<h1>Got it</h1><p><b>{{ item.title }}</b> marked as <span class="st-{{ item.status }}">{{ item.status }}</span>.</p>
<p class="small muted">Tomorrow's plan will take this into account.</p>
{% else %}<h1>Link not valid</h1>{% endif %}
<p><a href="/">Open dashboard</a></p></div>
{% endblock %}
