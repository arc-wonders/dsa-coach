{% extends "base.html" %}
{% block bare %}
<div style="min-height:100vh;display:grid;place-items:center;padding:16px">
  <div class="card" style="width:100%;max-width:360px;padding:28px">
    <div class="brand" style="padding:0 0 18px"><i>{ }</i><span>DSA Coach</span></div>
    <form method="post" action="/login" class="stack" style="gap:12px">
      <label class="f">Password<input type="password" name="password" autofocus></label>
      {% if bad %}<div class="small" style="color:var(--bad)">Wrong password.</div>{% endif %}
      <button class="btn primary" style="height:36px;justify-content:center">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
