{% extends "base.html" %}
{% block title %}Assistant · DSA Coach{% endblock %}
{% block body %}
<div class="page-head">
  <div><div class="eyebrow">Gemini</div><h1>Assistant</h1><div class="sub" style="margin-top:4px">Tell it about exams, internship crunch days or free weekends. It updates your schedule.</div></div>
  <button class="btn ghost" onclick="resetChat()">New chat</button>
</div>
<div class="card chat">
  {% if not enabled %}<div class="note" style="margin:12px">Set GEMINI_API_KEY to enable the assistant.</div>{% endif %}
  <div class="log" id="log">
    <div class="suggest" id="sugg">
      <button>My exams start day after tomorrow and run for 10 days</button>
      <button>Internship deadlines Thursday and Friday, keep those days off</button>
      <button>Where am I weakest?</button>
      <button>Am I on track for placements?</button>
    </div>
  </div>
  <form id="f"><input id="m" placeholder="Message the assistant…" autocomplete="off"><button class="btn primary" style="height:40px">Send</button></form>
</div>
<script>
let history = [];
const log = document.getElementById('log'), f = document.getElementById('f'), m = document.getElementById('m');
function add(text, cls) { const d = document.createElement('div'); d.className = 'bubble ' + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
async function send(t) {
  document.getElementById('sugg')?.remove();
  add(t, 'me'); const w = add('Thinking…', 'ai');
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: t, history }) });
    const reply = (await r.json()).reply; w.textContent = reply;
    if (r.ok) history.push({ role: 'user', text: t }, { role: 'model', text: reply });
  } catch (err) { w.textContent = 'Error: ' + err; }
}
f.onsubmit = e => { e.preventDefault(); const t = m.value.trim(); if (t) { m.value = ''; send(t); } };
document.querySelectorAll('#sugg button').forEach(b => b.onclick = () => send(b.textContent));
function resetChat() { history = []; location.reload(); }
</script>
{% endblock %}
