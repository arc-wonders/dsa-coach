<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DSA Coach{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=3">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="/static/app.js?v=3"></script>
</head>
<body>
{% if page != 'login' and page != 'action' %}
<div class="shell">
  <aside class="side">
    <div class="brand"><i>{ }</i><span>DSA Coach</span></div>
    <nav class="nav">
      <a href="/" class="{{ 'on' if page=='today' }}"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>Today</span></a>
      <a href="/insights" class="{{ 'on' if page=='insights' }}"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Insights</span></a>
      <a href="/schedule" class="{{ 'on' if page=='schedule' }}"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 5-7 4 4"/><circle cx="8" cy="11" r="1"/><circle cx="17" cy="7" r="1"/></svg><span>Schedule</span></a>
      <a href="/sheet" class="{{ 'on' if page=='sheet' }}"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Sheet</span></a>
      <a href="/history" class="{{ 'on' if page=='history' }}"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span>History</span></a>
      <a href="/chat" class="{{ 'on' if page=='chat' }}"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>Assistant</span></a>
    </nav>
    <div class="foot">Solves on LeetCode sync automatically.</div>
  </aside>
  <main class="main">
    {% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
    {% block body %}{% endblock %}
  </main>
</div>
{% else %}{% block bare %}{% endblock %}{% endif %}
</body></html>
