<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DSA Coach{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2328;--muted:#59636e;--line:#e3e6ea;--accent:#2f6feb;
--easy:#1a7f37;--med:#b35900;--hard:#cf222e;--chip:#eef1f4}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--text:#e6e8eb;--muted:#9aa4af;--line:#2a2f38;
--accent:#5b9bff;--easy:#3fb950;--med:#e3a03b;--hard:#f85149;--chip:#222732}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}
nav{display:flex;gap:18px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
nav b{margin-right:auto}
nav a{color:var(--muted)} nav a.on{color:var(--text);font-weight:600}
main{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px} h2{font-size:16px;margin:0 0 12px}
.muted{color:var(--muted)} .small{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat .v{font-size:24px;font-weight:650} .stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:16px} @media(max-width:800px){.cols{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse} td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--chip);font-size:12px}
.Easy{color:var(--easy)} .Medium{color:var(--med)} .Hard{color:var(--hard)}
.lbl-weak{color:var(--hard)} .lbl-developing{color:var(--med)} .lbl-strong{color:var(--easy)} .lbl-not{color:var(--muted)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;min-width:60px} .bar i{display:block;height:100%;background:var(--accent)}
button,.btn{font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
form.inline{display:inline}
input,select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.item{padding:12px 0;border-bottom:1px solid var(--line)} .item:last-child{border:none}
.item .t{font-weight:600;font-size:16px}
.status{font-size:12px;font-weight:600;text-transform:uppercase}
.st-solved{color:var(--easy)} .st-failed{color:var(--med)} .st-skipped,.st-missed{color:var(--muted)}
.msg{background:var(--chip);padding:8px 12px;border-radius:8px;margin-bottom:16px}
.mode-exam{background:#f7d9a6;color:#5a3b00} .mode-free{background:#c6ecd0;color:#0b4a1d} .mode-off{background:#e3e6ea;color:#555} .mode-normal{background:#d6e4ff;color:#0a3069}
.days{display:flex;gap:6px;flex-wrap:wrap} .day{width:62px;text-align:center;border-radius:8px;padding:6px 0;font-size:12px}
</style>
</head>
<body>
<nav><b>DSA Coach</b>
<a href="/" class="{{ 'on' if request.url.path=='/' }}">Today</a>
<a href="/schedule" class="{{ 'on' if request.url.path=='/schedule' }}">Schedule</a>
<a href="/history" class="{{ 'on' if request.url.path=='/history' }}">History</a>
<a href="/chat" class="{{ 'on' if request.url.path=='/chat' }}">Assistant</a></nav>
<main>{% block body %}{% endblock %}</main>
</body></html>
